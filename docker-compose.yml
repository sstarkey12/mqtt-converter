services:

  converter:
    # build: 
    #   context: .
    #   dockerfile: Dockerfile
    image: ghcr.io/sstarkey12/mqtt-converter:latest
    container_name: meshtastic-converter
    environment:
      # MQTT broker address and port
      - BROKER=123.456.78.9
      - PORT=1883
      # MQTT username
      - USERNAME=username
      # MQTT password
      - PASSWORD=password
      # Meshtastic config
      - REGION=us
      - ROOT_TOPIC=msh
      # Leave blank initially. If the ARF channel is encrypted, put its PSK here.
      - PSK=  
      # Set to 1 temporarily for troubleshooting
      - DEBUG=
    restart: unless-stopped
    


